{% extends "painel/base.html" %}
{% block corpo %}<main class="login"><div class="card"><h1>Propostas</h1><p>Entre para criar e acompanhar suas propostas.</p>{% if sem_empresa %}<div class="alerta aviso">Seu usuário ainda não está vinculado a nenhuma empresa.</div>{% endif %}<form method="post" action="/login" data-enviando="Entrando...">{% csrf_token %}<input type="hidden" name="voltar" value="{{ voltar }}"><div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required></div><div class="campo"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required></div>{% if erro %}<div class="alerta erro">{{ erro }}</div>{% endif %}<button class="btn destaque" style="width:100%">Entrar</button></form></div></main>{% endblock %}
