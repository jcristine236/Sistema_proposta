<div><div style="background:{{ fundo }};border:1px solid var(--line);border-radius:10px;padding:10px;min-height:64px;display:grid;place-items:center;margin-bottom:6px">{% if valor %}<img src="{{ valor }}" alt="" style="max-height:50px;max-width:100%">{% else %}<span class="muted" style="font-size:12.5px">Sem imagem</span>{% endif %}</div><div style="display:flex;gap:6px"><input name="{{ nome }}" value="{{ valor }}" placeholder="/uploads/... ou https://"><button type="button" class="btn claro pequeno" style="height:40px">Enviar</button></div><input type="file" hidden accept="image/png,image/jpeg,image/webp"></div>
