{% load proposta %}<section {{ p.attrs }}><div class="inner">{% if s.titulo %}{% include "proposta/_cabecalho.html" with numero=s.numero titulo=s.titulo eyebrow=None %}{% endif %}<figure class="rv zoom">{% if p.src %}<img src="{{ p.src }}" alt="{% if s.legenda is not None %}{{ s.legenda }}{% elif s.titulo is not None %}{{ s.titulo }}{% endif %}" loading="lazy">{% else %}<div class="img-vazia">Adicione uma imagem</div>{% endif %}{% if s.legenda %}<figcaption>{% pre s.legenda %}</figcaption>{% endif %}</figure></div></section>
