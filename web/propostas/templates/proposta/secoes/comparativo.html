{% load proposta %}<section {{ p.attrs }}><div class="inner">{% include "proposta/_cabecalho.html" with numero=s.numero titulo=s.titulo eyebrow=None %}<div class="dgrid">{% for it in s.itens %}<div class="dc rv" style="--d:{% atraso 0 0.08 forloop.counter0 3 %}s"><div class="top"><i>{% icone it.icone %}</i><h3>{{ it.titulo }}</h3></div><div class="y">{% icone "check" %}<span>{{ it.nosso }}</span></div><div class="n">{% icone "x" %}<span><em>{{ s.rotuloMercado }}:</em> {{ it.mercado }}</span></div></div>{% endfor %}</div></div></section>
