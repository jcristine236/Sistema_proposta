<aside class="lateral"><div class="marca">{% if tema.logoClaro %}<img src="{{ tema.logoClaro }}" alt="{{ empresa.nome }}" data-logo data-altura="34" data-largura-max="180" style="height:34px;width:auto;max-width:100%;opacity:0;transition:opacity .25s;display:block">{% else %}<b>{{ empresa.nome }}</b>{% endif %}</div><nav>{% for m in menu %}<div style="display:contents">{% if m.cabecalho %}<div class="grupo">{{ m.cabecalho }}</div>{% endif %}<a href="{{ m.href }}" class="{% if m.on %}on{% endif %}"><svg viewBox="0 0 24 24" aria-hidden="true">{{ m.icone|safe }}</svg>{{ m.rotulo }}</a></div>{% endfor %}</nav><div class="base"><form method="post" action="/admin/empresa-ativa" data-empresa-ativa>{% csrf_token %}<label><small>Empresa</small><select name="slug">{% for e in empresas %}<option value="{{ e.slug }}"{% if e.slug == empresa.slug %} selected{% endif %}>{{ e.nome }}</option>{% endfor %}</select></label></form><small>{{ usuario.nome }}</small><form method="post" action="/admin/sair">{% csrf_token %}<button class="sair">Sair</button></form></div></aside>
